<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Younblock UI reference (4 states)</title>
<style>
/* ===== CONFIG: every value the agent must port lives here ===== */
:root{
  --font: "Space Grotesk","Familjen Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; /* keep the app's existing font */
  --track-w:128px; --track-h:272px; --pill-w:112px; --pill-h:124px; --pad:8px; --pad-bottom:18px; /* extra bottom room = the cap's visible thickness */
  --r-track:34px; --r-cap:26px;                       /* concentric radii: cap = track - pad */
  --travel:calc(var(--track-h) - var(--pill-h) - var(--pad) - var(--pad-bottom));   /* pill slide distance (122px) */
  --edge:#8f130e;                                     /* side wall of the cap (its thickness) */
  --cap-top:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.08),inset 0 -2px 3px rgba(80,0,0,.30);
  --cap-rest:var(--cap-top),0 9px 0 var(--edge),0 10px 0 rgba(0,0,0,.38),0 20px 22px rgba(0,0,0,.50);
  --cap-press:var(--cap-top),0 3px 0 var(--edge),0 4px 0 rgba(0,0,0,.38),0 8px 10px rgba(0,0,0,.45);
  --red-1:#f0392c; --red-2:#d7291e; --red-3:#b81610; --red-4:#8f0d09;
}
/* per-state tokens */
.app[data-state="idle"]      {--c-aura:transparent;   --c-led:#6b6b78; --c-led-glow:transparent; --c-sub:#c9c8d4; --pill-glow:rgba(255,40,30,.40); --c-icon:#4a4a58}
.app[data-state="connecting"]{--c-aura:rgba(255,90,70,.55);   --c-led:#ffffff; --c-led-glow:rgba(255,255,255,.7); --c-sub:#c9c8d4; --pill-glow:rgba(255,40,30,.30); --c-icon:#4a4a58}
.app[data-state="connected"] {--c-aura:rgba(57,185,76,.55);   --c-led:#39b94c; --c-led-glow:rgba(57,185,76,.85); --c-sub:#f0f7f3; --pill-glow:rgba(255,40,30,.22); --c-icon:#2f5a47}
.app[data-state="failed"]    {--c-aura:rgba(255,167,38,.55);   --c-led:#ffa726; --c-led-glow:rgba(255,167,38,.85); --c-sub:#ffd9a0; --pill-glow:rgba(255,40,30,.30); --c-icon:#5a4230}

*{box-sizing:border-box;margin:0}
body{background:#111;color:#fff;font-family:var(--font);display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;min-height:100vh}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar button{background:#2a2a30;color:#fff;border:1px solid #444;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.bar button.on{background:#d7291e;border-color:#d7291e}

/* ===== phone ===== */
.app{position:relative;width:360px;height:780px;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;align-items:center;isolation:isolate}

/* BACKGROUNDS: stacked layers, cross-fade 700 ms (no hard cut) */
.bg{position:absolute;inset:0;z-index:-3;opacity:0;transition:opacity .7s ease}
.bg.idle{background:linear-gradient(180deg,#3b3a4a 0%,#2d2d37 35%,#26262e 70%,#26262e 100%)}
.bg.connected{background:linear-gradient(180deg,#54756a 0%,#46665b 38%,#2d443c 78%,#253a33 100%)}
.bg.failed{background:linear-gradient(180deg,#7b5a3f 0%,#664a33 38%,#3a2b20 78%,#2e2219 100%)}
.app[data-state="idle"] .bg.idle,.app[data-state="connecting"] .bg.idle,
.app[data-state="connected"] .bg.connected,.app[data-state="failed"] .bg.failed{opacity:1}

/* TEXTURE: fine halftone dots fading in toward the bottom + 5% grain */
.tex{position:absolute;inset:0;z-index:-2;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.075) 1px,transparent 1.5px);background-size:7px 7px;
  -webkit-mask-image:linear-gradient(180deg,transparent 35%,#000 100%);mask-image:linear-gradient(180deg,transparent 35%,#000 100%)}
.grain{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

/* HEADER */
header{width:100%;padding:16px 16px 0;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.brand i{width:34px;height:24px;background:linear-gradient(180deg,#f0392c,#c3180f);border-radius:7px;position:relative;box-shadow:0 0 14px rgba(255,40,30,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.brand i:after{content:"";position:absolute;left:13px;top:7px;border-left:9px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent}
.menu{width:44px;height:44px;border-radius:50%;border:0;color:#fff;font-size:20px;letter-spacing:1px;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 14px rgba(0,0,0,.35)}

/* STATUS BLOCK */
.status{margin-top:46px;text-align:center;min-height:178px;width:100%;padding:0 16px}
.ghost{width:92px;height:66px;margin:0 auto 12px;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.10);position:relative;transition:opacity .4s,height .4s,margin .4s}
.ghost:after{content:"";position:absolute;left:37px;top:19px;border-left:24px solid rgba(255,255,255,.12);border-top:14px solid transparent;border-bottom:14px solid transparent}
.app[data-state="failed"] .ghost:after{border-left-color:rgba(255,190,90,.30)}
.app[data-state="connected"] .ghost{opacity:0;height:0;margin:0}
.eyebrow{font-size:15px;color:var(--c-sub);opacity:.85;letter-spacing:.3px}
.title{font-size:32px;font-weight:700;line-height:1.1;margin-top:4px;white-space:nowrap;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.sub{margin-top:8px;font-size:15px;color:var(--c-sub)}
.timer{display:none;margin-top:14px;font-size:34px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums}
.data{display:none;margin-top:8px;font-size:15px;color:var(--c-sub);gap:18px;justify-content:center}
.app[data-state="connected"] .timer{display:block}
.app[data-state="connected"] .data{display:flex}

/* DIAL: track + pill. No rings or circles anywhere. */
.dial{position:relative;width:360px;height:360px;margin-top:auto;flex:none}
.track{position:absolute;left:50%;top:50%;width:var(--track-w);height:var(--track-h);margin:calc(var(--track-h)/-2) 0 0 calc(var(--track-w)/-2);border-radius:var(--r-track);
  background:linear-gradient(180deg,rgba(0,0,0,.38),rgba(0,0,0,.16) 60%,rgba(255,255,255,.03));
  box-shadow:inset 0 10px 16px rgba(0,0,0,.55),inset 0 -3px 5px rgba(255,255,255,.08),0 1px 0 rgba(255,255,255,.10),0 0 0 1px rgba(0,0,0,.28);
  touch-action:none;cursor:pointer;transition:box-shadow .6s}
.chev{position:absolute;left:50%;width:20px;height:20px;margin-left:-10px;color:rgba(255,255,255,.85);transition:all .5s}
.chev.down{bottom:18px;display:none}
.app[data-state="connected"] .chev.down{display:block}
.pill{position:absolute;left:var(--pad);top:var(--pad);width:var(--pill-w);height:var(--pill-h);border-radius:var(--r-cap);
  background:linear-gradient(180deg,#ec3d34 0%,#d62a20 55%,#c8231d 100%);
  box-shadow:var(--cap-rest),0 0 30px var(--pill-glow);
  transform:translateY(var(--travel));translate:0 0;transition:transform .55s cubic-bezier(.2,.9,.3,1.15),translate .12s ease-out,box-shadow .12s ease-out;touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:13px 0 12px}
.pill:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(130% 40% at 50% 0%,rgba(255,255,255,.20),transparent 70%);pointer-events:none}
.app[data-state="connected"] .pill,.app[data-state="connecting"] .pill{transform:translateY(0)}
/* PRESSED: the cap sinks 6px, its side wall shrinks from 9px to 3px (like a real key) */
.app.dragging .pill{translate:0 6px;box-shadow:var(--cap-press),0 0 20px var(--pill-glow)!important;animation:none!important}
.led{width:24px;height:4px;border-radius:2px;background:var(--c-led);box-shadow:inset 0 1px 1px rgba(0,0,0,.4),0 0 10px var(--c-led-glow);transition:background .4s,box-shadow .4s;position:relative;z-index:1}
.app[data-state="connecting"] .led{animation:blink 1s ease-in-out infinite}
.grip{display:flex;flex-direction:column;gap:4px;width:34px;position:relative;z-index:1}
.grip i{height:2px;border-radius:1px;background:rgba(70,0,0,.40);box-shadow:0 1px 0 rgba(255,255,255,.18)}
.label{font-weight:700;font-size:18px;letter-spacing:2.2px;text-transform:uppercase;text-shadow:0 1px 1px rgba(90,0,0,.45);position:relative;z-index:1}
.pwr{width:24px;height:24px;display:grid;place-items:center;position:relative;z-index:1}
.pwr svg{width:24px;height:24px;filter:drop-shadow(0 1px 0 rgba(90,0,0,.45))}
.hint{font-size:14px;color:#d9d8e2;opacity:.9;margin-top:6px}

/* OPEN YOUTUBE CARD (connected only) */
.card{width:calc(100% - 32px);margin:12px 16px 18px;border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 18px rgba(0,0,0,.30);
  opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .45s,transform .45s}
.app[data-state="connected"] .card{opacity:1;transform:none;pointer-events:auto}
.card .ic{width:48px;height:40px;border-radius:11px;background:linear-gradient(180deg,#f0392c,#c3180f);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);position:relative;flex:none}
.card .ic:after{content:"";position:absolute;left:19px;top:11px;border-left:13px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.card b{display:block;font-size:17px} .card span{font-size:14px;color:var(--c-sub)}
.app:not([data-state="connected"]) .spacer{height:78px}

/* ANIMATION */
@keyframes aura{0%,100%{box-shadow:inset 0 10px 16px rgba(0,0,0,.55),inset 0 -3px 5px rgba(255,255,255,.08),0 1px 0 rgba(255,255,255,.10),0 0 0 1px rgba(0,0,0,.28),0 0 14px 1px var(--c-aura)}50%{box-shadow:inset 0 10px 16px rgba(0,0,0,.55),inset 0 -3px 5px rgba(255,255,255,.08),0 1px 0 rgba(255,255,255,.10),0 0 0 1px rgba(0,0,0,.28),0 0 46px 8px var(--c-aura)}}
@keyframes aurabeat{0%,100%,48%{box-shadow:inset 0 10px 16px rgba(0,0,0,.55),inset 0 -3px 5px rgba(255,255,255,.08),0 1px 0 rgba(255,255,255,.10),0 0 0 1px rgba(0,0,0,.28),0 0 14px 1px var(--c-aura)}12%,36%{box-shadow:inset 0 10px 16px rgba(0,0,0,.55),inset 0 -3px 5px rgba(255,255,255,.08),0 1px 0 rgba(255,255,255,.10),0 0 0 1px rgba(0,0,0,.28),0 0 40px 7px var(--c-aura)}24%{box-shadow:inset 0 10px 16px rgba(0,0,0,.55),inset 0 -3px 5px rgba(255,255,255,.08),0 1px 0 rgba(255,255,255,.10),0 0 0 1px rgba(0,0,0,.28),0 0 22px 3px var(--c-aura)}}
@keyframes ledbreath{0%,100%{box-shadow:0 0 6px var(--c-led-glow)}50%{box-shadow:0 0 16px 2px var(--c-led-glow)}}
.app[data-state="connected"] .track{animation:aura 3.4s ease-in-out infinite}
.app[data-state="connecting"] .track{animation:aura 1.1s ease-in-out infinite}
.app[data-state="failed"] .track{animation:aurabeat 3.6s ease-in-out infinite}
.app[data-state="connected"] .led{animation:ledbreath 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.035);opacity:.55}}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}12%{transform:scale(1.05);opacity:.7}24%{transform:scale(1);opacity:1}36%{transform:scale(1.05);opacity:.7}48%{transform:scale(1)}}
@keyframes blink{50%{opacity:.25}}
/* SWIPE-UP CUE: 3 chevrons light up one after another, bottom to top, peak opacity .45, 1.8 s loop */
.swipe-up{position:absolute;left:50%;top:30px;width:30px;margin-left:-15px;display:none;flex-direction:column;align-items:center;gap:2px;color:#fff;pointer-events:none;transition:opacity .2s}
.swipe-up svg{width:28px;height:16px;opacity:0;animation:swipecue 1.8s ease-in-out infinite}
.swipe-up svg:nth-child(1){animation-delay:.5s}.swipe-up svg:nth-child(2){animation-delay:.25s}.swipe-up svg:nth-child(3){animation-delay:0s}
@keyframes swipecue{0%{opacity:0;transform:translateY(8px)}35%{opacity:.45}65%{opacity:.45}100%{opacity:0;transform:translateY(-8px)}}
.app[data-state="idle"] .swipe-up,.app[data-state="failed"] .swipe-up{display:flex}
.app.dragging .swipe-up{opacity:0}
@media (prefers-reduced-motion:reduce){.swipe-up svg{opacity:.4!important;transform:none!important}}
@keyframes pulsepill{0%,100%{box-shadow:var(--cap-rest),0 0 22px rgba(255,40,30,.25)}45%{box-shadow:var(--cap-rest),0 0 80px rgba(255,60,45,.85)}}
@keyframes pulselabel{0%,100%{opacity:.55}45%{opacity:1}}
.app[data-state="connecting"] .pill{animation:pulsepill 1.1s ease-in-out infinite}
.app[data-state="connecting"] .label{animation:pulselabel 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:var(--cap-rest),0 0 26px rgba(255,40,30,.28)}50%{box-shadow:var(--cap-rest),0 0 52px rgba(255,40,30,.50)}}
.app[data-state="idle"] .pill,.app[data-state="failed"] .pill{animation:glow 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>

<div class="app" id="app" data-state="idle">
  <div class="bg idle"></div><div class="bg connected"></div><div class="bg failed"></div>
  <div class="tex"></div><div class="grain"></div>

  <header><div class="brand"><i></i>Younblock</div><button class="menu" aria-label="Menu">•••</button></header>

  <section class="status" aria-live="polite">
    <div class="ghost"></div>
    <div class="eyebrow">YouTube</div>
    <div class="title" id="title">Not connected</div>
    <div class="sub" id="sub">Last session: 216 KB · 2 s</div>
    <div class="timer" id="timer">00:00:00</div>
    <div class="data"><span>↓ 6.33 MB</span><span>↑ 295 KB</span></div>
  </section>

  <div class="dial" id="dial">
    <div class="track" id="track" role="button" tabindex="0" aria-label="Connect">
      <svg class="chev down" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l5 5 5-5M5 10l5 5 5-5"/></svg>
      <div class="swipe-up" aria-hidden="true">
        <svg viewBox="0 0 28 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l10-9 10 9"/></svg>
        <svg viewBox="0 0 28 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l10-9 10 9"/></svg>
        <svg viewBox="0 0 28 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l10-9 10 9"/></svg>
      </div>
      <div class="pill" id="pill">
        <div class="led"></div>
        <div class="grip"><i></i><i></i><i></i></div>
        <div class="label" id="label">Start</div>
        <div class="pwr"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><path d="M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></div>
      </div>
    </div>
  </div>
  <div class="hint" id="hint">Tap or swipe up to connect</div>

  <div class="spacer"></div>
  <div class="card"><div class="ic"></div><div><b>Open YouTube</b><span>Launch the YouTube app</span></div></div>
</div>

<script>
const app=document.getElementById('app');
const T={
 idle:      {title:'Not connected',  sub:'Last session: 216 KB · 2 s', label:'Start',    hint:'Tap or swipe up to connect'},
 connecting:{title:'Connecting…',    sub:'Setting things up',          label:'Wait',     hint:'Almost there'},
 connected: {title:'Connected',      sub:'YouTube unblocked.',         label:'Stop',     hint:'Tap or swipe down to disconnect'},
 failed:    {title:"Couldn't connect",sub:'Could not start. Try again.',label:'Retry',    hint:'Tap or swipe up to retry'}
};
let tick,secs=0;
function set(s){
  app.dataset.state=s;const t=T[s];
  title.textContent=t.title;sub.textContent=t.sub;label.textContent=t.label;hint.textContent=t.hint;
  document.getElementById('track').setAttribute('aria-label',t.hint);
  clearInterval(tick);if(s==='connected'){secs=45;tick=setInterval(()=>{secs++;timer.textContent=[secs/3600,secs/60%60,secs%60].map(n=>String(Math.floor(n)).padStart(2,'0')).join(':')},1000)}
  [...bar.children].forEach(b=>b.classList.toggle('on',b.dataset.s===s));
}
const bar=document.getElementById('bar');
Object.keys(T).forEach(s=>{const b=document.createElement('button');b.textContent=s;b.dataset.s=s;b.onclick=()=>set(s);bar.appendChild(b)});
/* GESTURE: pull the pill from bottom to top to connect (it follows the finger); pull down to disconnect. A tap also works. */
let busy;const track=document.getElementById('track'),pill=document.getElementById('pill');
const TRAVEL=272-124-8-18;                         /* keep in sync with --travel */
function go(){const s=app.dataset.state;if(s==='connecting')return;
  if(s==='connected'){set('idle');return}
  set('connecting');clearTimeout(busy);busy=setTimeout(()=>set('connected'),2200);}   /* demo only: real app uses engine status */
let y0=null,base=0,moved=0;
track.addEventListener('pointerdown',e=>{const s=app.dataset.state;if(s==='connecting')return;
  y0=e.clientY;moved=0;base=s==='connected'?0:TRAVEL;track.setPointerCapture(e.pointerId);app.classList.add('dragging');if(navigator.vibrate)navigator.vibrate(8);pill.style.transition='none';pill.style.animation='none'});
track.addEventListener('pointermove',e=>{if(y0===null)return;const dy=e.clientY-y0;moved=Math.max(moved,Math.abs(dy));
  pill.style.transform='translateY('+Math.max(0,Math.min(TRAVEL,base+dy))+'px)'});
track.addEventListener('pointerup',e=>{if(y0===null)return;const dy=e.clientY-y0;y0=null;
  pill.style.transition='';pill.style.transform='';pill.style.animation='';app.classList.remove('dragging');
  const up=app.dataset.state!=='connected';
  if(moved<10||(up&&dy<-TRAVEL*.45)||(!up&&dy>TRAVEL*.45))go();});   /* otherwise the pill springs back */
track.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go()});
set('idle');
</script>
</body>
</html>
