# The Android shell's build defaults. JVM headroom for AGP 9; the app
# module carries no AndroidX dependency (a plain Activity + WebView keeps
# the dependency surface to the AAR alone), so no useAndroidX flag.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.nonTransitiveRClass=true
